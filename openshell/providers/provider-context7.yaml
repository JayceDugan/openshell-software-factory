id: context7
resource_version: 4
display_name: Context7
description: Context7 MCP Server (up-to-date library documentation)
category: knowledge
inference_capable: false
credentials:
  - name: api_key
    description: Context7 MCP API Key
    env_vars:
      - CONTEXT_7_MCP_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials:
    - api_key
endpoints:
  - host: mcp.context7.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/curl, /usr/local/bin/curl, /usr/local/bin/node, /usr/bin/node, /usr/local/bin/omp]
