# Policy: developer roles (writes into the mounted repo)
# Consumed directly by OpenShell (`--policy`), so this stays plain OpenShell schema.
#
# Paths listed in NEITHER list are inaccessible. include_workdir adds the driver-resolved
# working directory (/sandbox/work in these images) to read_write.

version: 1

filesystem_policy:
  include_workdir: true          # /sandbox/work -> read_write (the mounted repo)
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /sandbox/agent             # harness config, sessions, caches, pi-installed packages

landlock:
  compatibility: hard_requirement
